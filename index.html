<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PrakritiSense — Discover Your Ayurvedic Nature</title>
  <meta name="description"
    content="Discover your unique Ayurvedic mind-body constitution (Prakriti) with PrakritiSense. Rooted in 5,000 years of Ayurvedic wisdom, take our 30-question assessment and receive personalised guidance." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600&family=Jost:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    /* ===== CSS VARIABLES & RESET ===== */
    :root {
      --forest: #1a3d2b;
      --forest-mid: #2d5a3d;
      --forest-light: #4a8c5c;
      --gold: #c9a84c;
      --gold-light: #e8c97a;
      --gold-pale: #f5e6b8;
      --cream: #faf6ef;
      --cream-dark: #f0e8d8;
      --white: #ffffff;
      --vata: #7b9dba;
      --pitta: #c4704a;
      --kapha: #5c8c6a;
      --text-dark: #1a1a1a;
      --text-mid: #3d3d3d;
      --text-muted: #7a7a6a;
      --bg: var(--cream);
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(201, 168, 76, 0.2);
      --nav-bg: rgba(250, 246, 239, 0.92);
      --shadow: 0 4px 24px rgba(26, 61, 43, 0.08);
      --shadow-lg: 0 12px 48px rgba(26, 61, 43, 0.14);
      --radius: 16px;
      --radius-sm: 8px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.dark {
      --bg: #0f1e15;
      --card-bg: rgba(19, 31, 24, 0.9);
      --card-border: rgba(201, 168, 76, 0.15);
      --nav-bg: rgba(15, 30, 21, 0.95);
      --cream: #0f1e15;
      --cream-dark: #131f18;
      --text-dark: #e8e0d0;
      --text-mid: #c8c0b0;
      --text-muted: #8a8a7a;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.4);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Jost', sans-serif;
      background: var(--bg);
      color: var(--text-dark);
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
      min-height: 100vh;
    }

    img {
      max-width: 100%;
    }

    button {
      cursor: pointer;
      font-family: 'Jost', sans-serif;
    }

    input,
    textarea,
    select {
      font-family: 'Jost', sans-serif;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    /* ===== TYPOGRAPHY ===== */
    h1,
    h2,
    h3,
    h4,
    h5 {
      font-family: 'Cormorant Garamond', serif;
      line-height: 1.2;
    }

    .serif {
      font-family: 'Cormorant Garamond', serif;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-track {
      background: var(--cream-dark);
    }

    ::-webkit-scrollbar-thumb {
      background: var(--forest-light);
      border-radius: 3px;
    }

    /* ===== NAVBAR ===== */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 0 2rem;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: var(--transition);
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--forest);
      cursor: pointer;
    }

    body.dark .nav-logo {
      color: var(--gold-light);
    }

    .nav-logo svg {
      width: 32px;
      height: 32px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 2rem;
      list-style: none;
    }

    .nav-links a,
    .nav-link-btn {
      font-size: 0.9rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--text-mid);
      cursor: pointer;
      background: none;
      border: none;
      transition: color 0.2s;
      padding: 0;
    }

    body.dark .nav-links a,
    body.dark .nav-link-btn {
      color: var(--text-mid);
    }

    .nav-links a:hover,
    .nav-link-btn:hover {
      color: var(--forest);
    }

    body.dark .nav-links a:hover,
    body.dark .nav-link-btn:hover {
      color: var(--gold-light);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1rem;
      transition: var(--transition);
      color: var(--text-dark);
    }

    .btn-icon:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    .lang-btn {
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--card-border);
      background: var(--card-bg);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      cursor: pointer;
      color: var(--text-mid);
      transition: var(--transition);
    }

    .lang-btn:hover {
      border-color: var(--gold);
      color: var(--forest);
    }

    body.dark .lang-btn:hover {
      color: var(--gold-light);
    }

    .btn-sm {
      padding: 8px 20px;
      border-radius: 24px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      border: none;
    }

    .btn-outline {
      background: transparent;
      border: 1.5px solid var(--forest);
      color: var(--forest);
    }

    body.dark .btn-outline {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .btn-outline:hover {
      background: var(--forest);
      color: var(--white);
    }

    body.dark .btn-outline:hover {
      background: var(--gold);
      color: var(--forest);
    }

    .btn-filled {
      background: var(--forest);
      color: var(--white);
      border: 1.5px solid var(--forest);
    }

    body.dark .btn-filled {
      background: var(--gold);
      color: var(--forest);
      border-color: var(--gold);
    }

    .btn-filled:hover {
      background: var(--forest-mid);
    }

    body.dark .btn-filled:hover {
      background: var(--gold-light);
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--forest-light), var(--forest));
      color: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      border: 2px solid var(--gold);
      flex-shrink: 0;
    }

    .admin-badge {
      padding: 4px 10px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--forest);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }

    .mobile-menu-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-dark);
      cursor: pointer;
    }

    @media (max-width: 768px) {
      .nav-links {
        display: none;
      }

      .mobile-menu-btn {
        display: block;
      }

      .navbar {
        padding: 0 1rem;
      }

      .nav-right .btn-sm {
        display: none;
      }
    }

    /* ===== TOAST NOTIFICATIONS ===== */
    .toast-container {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .toast {
      padding: 12px 20px;
      border-radius: 12px;
      background: var(--forest);
      color: var(--white);
      font-size: 0.875rem;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      animation: slideInRight 0.3s ease, fadeOut 0.5s ease 2.5s forwards;
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 320px;
    }

    .toast.error {
      background: #c0392b;
    }

    .toast.success {
      background: var(--forest);
    }

    @keyframes slideInRight {
      from {
        transform: translateX(100%);
        opacity: 0;
      }

      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes fadeOut {
      from {
        opacity: 1;
      }

      to {
        opacity: 0;
        pointer-events: none;
      }
    }

    /* ===== PAGE TRANSITIONS ===== */
    .page-enter {
      animation: pageIn 0.4s ease forwards;
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== HERO SECTION ===== */
    .hero {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      padding: 100px 2rem 4rem;
      background: linear-gradient(160deg, var(--cream) 0%, var(--cream-dark) 60%, rgba(26, 61, 43, 0.06) 100%);
    }

    body.dark .hero {
      background: linear-gradient(160deg, #0f1e15 0%, #0a1810 60%, #0d1f12 100%);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 20px;
      border-radius: 30px;
      background: rgba(201, 168, 76, 0.12);
      border: 1px solid rgba(201, 168, 76, 0.35);
      color: var(--gold);
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 2rem;
      animation: fadeInDown 0.8s ease;
    }

    .hero h1 {
      font-size: clamp(3rem, 8vw, 5.5rem);
      font-weight: 600;
      line-height: 1.1;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
      animation: fadeInUp 0.8s ease 0.1s both;
    }

    .hero h1 em {
      font-style: italic;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-subtitle {
      max-width: 600px;
      font-size: 1.1rem;
      line-height: 1.8;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .hero-ctas {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
      animation: fadeInUp 0.8s ease 0.3s both;
    }

    .btn-hero {
      padding: 14px 32px;
      border-radius: 32px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      position: relative;
      overflow: hidden;
    }

    .btn-hero-primary {
      background: linear-gradient(135deg, var(--forest), var(--forest-mid));
      color: var(--white);
      box-shadow: 0 4px 20px rgba(26, 61, 43, 0.3);
    }

    .btn-hero-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(26, 61, 43, 0.4);
    }

    body.dark .btn-hero-primary {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--forest);
      box-shadow: 0 4px 20px rgba(201, 168, 76, 0.3);
    }

    .btn-hero-outline {
      background: transparent;
      border: 2px solid var(--forest);
      color: var(--forest);
    }

    body.dark .btn-hero-outline {
      border-color: var(--gold);
      color: var(--gold-light);
    }

    .btn-hero-outline:hover {
      background: var(--forest);
      color: var(--white);
      transform: translateY(-2px);
    }

    body.dark .btn-hero-outline:hover {
      background: var(--gold);
      color: var(--forest);
    }

    .scroll-indicator {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      animation: bounceDown 2s ease infinite;
    }

    @keyframes bounceDown {

      0%,
      100% {
        transform: translateX(-50%) translateY(0);
      }

      50% {
        transform: translateX(-50%) translateY(8px);
      }
    }

    /* ===== FLOATING BOTANICALS ===== */
    .botanical-float {
      position: absolute;
      pointer-events: none;
      opacity: 0.12;
    }

    body.dark .botanical-float {
      opacity: 0.07;
    }

    .float-1 {
      top: 10%;
      left: 5%;
      animation: floatA 8s ease-in-out infinite;
    }

    .float-2 {
      top: 20%;
      right: 8%;
      animation: floatB 10s ease-in-out infinite;
    }

    .float-3 {
      bottom: 20%;
      left: 10%;
      animation: floatA 12s ease-in-out infinite 2s;
    }

    .float-4 {
      bottom: 15%;
      right: 5%;
      animation: floatB 9s ease-in-out infinite 1s;
    }

    .float-5 {
      top: 50%;
      left: 2%;
      animation: floatA 11s ease-in-out infinite 3s;
    }

    @keyframes floatA {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-20px) rotate(8deg);
      }
    }

    @keyframes floatB {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-15px) rotate(-6deg);
      }
    }

    /* ===== SECTIONS ===== */
    .section {
      padding: 5rem 2rem;
    }

    .section-center {
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-badge {
      display: inline-block;
      padding: 5px 16px;
      border-radius: 20px;
      background: rgba(201, 168, 76, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.3);
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
    }

    .section-divider {
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--gold), transparent);
      margin: 1.5rem auto;
      border-radius: 2px;
    }

    /* ===== WHAT IS PRAKRITI SECTION ===== */
    .prakriti-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: center;
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .prakriti-grid {
        grid-template-columns: 1fr;
      }
    }

    .prakriti-text p {
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--text-mid);
      margin-bottom: 1.5rem;
    }

    .prakriti-ref {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 8px 12px;
      border-left: 3px solid var(--gold);
      background: rgba(201, 168, 76, 0.06);
      border-radius: 0 8px 8px 0;
      margin-bottom: 2rem;
    }

    .stats-row {
      display: flex;
      gap: 2rem;
      flex-wrap: wrap;
      margin-top: 2rem;
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--gold);
      display: block;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .prakriti-decoration {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 400px;
      background: radial-gradient(circle at 50% 50%, rgba(201, 168, 76, 0.08) 0%, transparent 70%);
      border-radius: 24px;
      border: 1px solid var(--card-border);
      position: relative;
      overflow: hidden;
    }

    /* ===== DOSHA NAV ===== */
    .dosha-nav {
      position: sticky;
      top: 64px;
      z-index: 100;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 0.75rem 2rem;
      display: flex;
      justify-content: center;
      gap: 1rem;
    }

    .dosha-pill {
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid transparent;
      transition: var(--transition);
    }

    .dosha-pill.vata {
      color: var(--vata);
      border-color: var(--vata);
    }

    .dosha-pill.vata:hover,
    .dosha-pill.vata.active {
      background: var(--vata);
      color: white;
    }

    .dosha-pill.pitta {
      color: var(--pitta);
      border-color: var(--pitta);
    }

    .dosha-pill.pitta:hover,
    .dosha-pill.pitta.active {
      background: var(--pitta);
      color: white;
    }

    .dosha-pill.kapha {
      color: var(--kapha);
      border-color: var(--kapha);
    }

    .dosha-pill.kapha:hover,
    .dosha-pill.kapha.active {
      background: var(--kapha);
      color: white;
    }

    /* ===== DOSHA SECTIONS ===== */
    .dosha-section {
      padding: 5rem 2rem;
      border-bottom: 1px solid var(--card-border);
    }

    .dosha-header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 3rem;
      align-items: start;
      margin-bottom: 3rem;
    }

    @media (max-width: 768px) {
      .dosha-header {
        grid-template-columns: 1fr;
      }
    }

    .dosha-symbol-circle {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      flex-shrink: 0;
    }

    .dosha-symbol-circle.vata {
      background: rgba(123, 157, 186, 0.15);
      border: 2px solid rgba(123, 157, 186, 0.3);
    }

    .dosha-symbol-circle.pitta {
      background: rgba(196, 112, 74, 0.15);
      border: 2px solid rgba(196, 112, 74, 0.3);
    }

    .dosha-symbol-circle.kapha {
      background: rgba(92, 140, 106, 0.15);
      border: 2px solid rgba(92, 140, 106, 0.3);
    }

    .dosha-title-area h2 {
      font-size: 2.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .dosha-title-area h2.vata {
      color: var(--vata);
    }

    .dosha-title-area h2.pitta {
      color: var(--pitta);
    }

    .dosha-title-area h2.kapha {
      color: var(--kapha);
    }

    .element-badge {
      display: inline-block;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin-bottom: 1rem;
    }

    .element-badge.vata {
      background: rgba(123, 157, 186, 0.15);
      color: var(--vata);
      border: 1px solid var(--vata);
    }

    .element-badge.pitta {
      background: rgba(196, 112, 74, 0.15);
      color: var(--pitta);
      border: 1px solid var(--pitta);
    }

    .element-badge.kapha {
      background: rgba(92, 140, 106, 0.15);
      color: var(--kapha);
      border: 1px solid var(--kapha);
    }

    .quality-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    .quality-tag {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 500;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
    }

    .dosha-overview {
      font-size: 1.05rem;
      line-height: 1.9;
      color: var(--text-mid);
    }

    .dosha-detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 1.5rem;
      margin-top: 2rem;
    }

    .dosha-detail-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .dosha-detail-card h4 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
    }

    .dosha-detail-card h4.vata {
      color: var(--vata);
      border-bottom: 2px solid rgba(123, 157, 186, 0.3);
    }

    .dosha-detail-card h4.pitta {
      color: var(--pitta);
      border-bottom: 2px solid rgba(196, 112, 74, 0.3);
    }

    .dosha-detail-card h4.kapha {
      color: var(--kapha);
      border-bottom: 2px solid rgba(92, 140, 106, 0.3);
    }

    .trait-row {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 0.75rem;
    }

    .trait-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--text-dark);
      min-width: 80px;
    }

    .trait-value {
      font-size: 0.875rem;
      color: var(--text-mid);
      line-height: 1.5;
    }

    .balance-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-top: 2rem;
    }

    @media (max-width: 768px) {
      .balance-grid {
        grid-template-columns: 1fr;
      }
    }

    .balance-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 1.5rem;
      backdrop-filter: blur(8px);
    }

    .balance-card h4 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 1rem;
    }

    .balance-card ul {
      list-style: none;
    }

    .balance-card ul li {
      padding: 0.4rem 0;
      font-size: 0.9rem;
      color: var(--text-mid);
    }

    .balance-card.positive ul li::before {
      content: "✅ ";
    }

    .balance-card.warning ul li::before {
      content: "⚠️ ";
    }

    /* ===== HOW IT WORKS ===== */
    .how-it-works {
      background: linear-gradient(135deg, rgba(26, 61, 43, 0.04) 0%, rgba(201, 168, 76, 0.04) 100%);
    }

    body.dark .how-it-works {
      background: linear-gradient(135deg, rgba(26, 61, 43, 0.3) 0%, rgba(201, 168, 76, 0.05) 100%);
    }

    .steps-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2rem;
      margin-top: 3rem;
    }

    @media (max-width: 768px) {
      .steps-grid {
        grid-template-columns: 1fr;
      }
    }

    .step-card {
      text-align: center;
      padding: 2.5rem 2rem;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      transition: var(--transition);
      position: relative;
    }

    .step-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg);
    }

    .step-number {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--forest);
      font-weight: 800;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .step-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .step-card h3 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: var(--text-dark);
    }

    .step-card p {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.7;
    }

    /* ===== FAQ ===== */
    .faq-list {
      max-width: 720px;
      margin: 2rem auto 0;
    }

    .faq-item {
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      margin-bottom: 0.75rem;
      overflow: hidden;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
    }

    .faq-question {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.5rem;
      background: none;
      border: none;
      font-family: 'Jost', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-dark);
      cursor: pointer;
      text-align: left;
      transition: color 0.2s;
    }

    .faq-question:hover {
      color: var(--forest);
    }

    body.dark .faq-question:hover {
      color: var(--gold-light);
    }

    .faq-chevron {
      transition: transform 0.3s;
      font-size: 1.2rem;
      color: var(--gold);
    }

    .faq-chevron.open {
      transform: rotate(180deg);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease;
      padding: 0 1.5rem;
    }

    .faq-answer.open {
      max-height: 300px;
      padding: 0 1.5rem 1.25rem;
    }

    .faq-answer p {
      font-size: 0.95rem;
      color: var(--text-mid);
      line-height: 1.8;
    }

    /* ===== FOOTER ===== */
    .footer {
      background: var(--forest);
      color: rgba(255, 255, 255, 0.8);
      padding: 3rem 2rem 1.5rem;
    }

    body.dark .footer {
      background: #0a150e;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 3rem;
      margin-bottom: 2rem;
    }

    @media (max-width: 768px) {
      .footer-grid {
        grid-template-columns: 1fr;
      }
    }

    .footer-brand h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      color: var(--gold-light);
      margin-bottom: 0.5rem;
    }

    .footer-brand p {
      font-size: 0.875rem;
      line-height: 1.7;
      color: rgba(255, 255, 255, 0.6);
    }

    .footer-links h4 {
      color: var(--gold-light);
      font-size: 0.875rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .footer-links ul {
      list-style: none;
    }

    .footer-links ul li {
      margin-bottom: 0.5rem;
    }

    .footer-links ul li a {
      font-size: 0.875rem;
      color: rgba(255, 255, 255, 0.6);
      transition: color 0.2s;
      cursor: pointer;
    }

    .footer-links ul li a:hover {
      color: var(--gold-light);
    }

    .footer-disclaimer {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 1.5rem;
      text-align: center;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
    }

    /* ===== AUTH PAGES ===== */
    .auth-layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    @media (max-width: 768px) {
      .auth-layout {
        grid-template-columns: 1fr;
      }
    }

    .auth-panel {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .auth-deco {
      background: linear-gradient(160deg, var(--forest) 0%, var(--forest-mid) 50%, #0d2a1a 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem;
      color: var(--white);
      position: relative;
      overflow: hidden;
    }

    @media (max-width: 768px) {
      .auth-deco {
        display: none;
      }
    }

    .auth-deco h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.5rem;
      font-weight: 600;
      color: var(--gold-light);
      text-align: center;
      margin-bottom: 1rem;
    }

    .auth-deco p {
      text-align: center;
      color: rgba(255, 255, 255, 0.7);
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .auth-deco-symbols {
      display: flex;
      gap: 1.5rem;
      margin: 2rem 0;
      font-size: 2.5rem;
      opacity: 0.6;
    }

    .auth-form-box {
      width: 100%;
      max-width: 440px;
    }

    .auth-form-box h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--text-dark);
    }

    .auth-form-box p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-mid);
      margin-bottom: 6px;
    }

    .form-input {
      width: 100%;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      border: 1.5px solid var(--card-border);
      background: var(--card-bg);
      color: var(--text-dark);
      font-size: 0.95rem;
      transition: var(--transition);
    }

    .form-input:focus {
      outline: none;
      border-color: var(--forest);
      box-shadow: 0 0 0 3px rgba(26, 61, 43, 0.1);
    }

    body.dark .form-input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.1);
    }

    .form-input.error {
      border-color: #e74c3c;
    }

    .input-wrapper {
      position: relative;
    }

    .input-eye {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--text-muted);
    }

    .form-error {
      font-size: 0.78rem;
      color: #e74c3c;
      margin-top: 4px;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-check input {
      width: auto;
    }

    .form-check label {
      font-size: 0.875rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-link {
      font-size: 0.875rem;
      color: var(--forest);
      cursor: pointer;
      font-weight: 500;
    }

    body.dark .form-link {
      color: var(--gold-light);
    }

    .form-link:hover {
      text-decoration: underline;
    }

    .btn-full {
      width: 100%;
      padding: 14px;
      border-radius: 32px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
      margin-bottom: 0.75rem;
    }

    .btn-primary-full {
      background: linear-gradient(135deg, var(--forest), var(--forest-mid));
      color: var(--white);
      box-shadow: 0 4px 16px rgba(26, 61, 43, 0.25);
    }

    body.dark .btn-primary-full {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--forest);
      box-shadow: 0 4px 16px rgba(201, 168, 76, 0.25);
    }

    .btn-primary-full:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 24px rgba(26, 61, 43, 0.35);
    }

    .btn-google-full {
      background: var(--card-bg);
      color: var(--text-dark);
      border: 1.5px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-google-full:hover {
      border-color: var(--gold);
    }

    .divider-or {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.8rem;
      position: relative;
      margin: 1rem 0;
    }

    .divider-or::before,
    .divider-or::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--card-border);
    }

    .divider-or::before {
      left: 0;
    }

    .divider-or::after {
      right: 0;
    }

    .auth-switch {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    .auth-switch span {
      color: var(--forest);
      font-weight: 600;
      cursor: pointer;
    }

    body.dark .auth-switch span {
      color: var(--gold-light);
    }

    /* ===== PASSWORD STRENGTH ===== */
    .strength-bar {
      height: 4px;
      border-radius: 2px;
      margin-top: 6px;
      transition: var(--transition);
    }

    .strength-weak {
      background: #e74c3c;
      width: 25%;
    }

    .strength-fair {
      background: #f39c12;
      width: 50%;
    }

    .strength-strong {
      background: #27ae60;
      width: 75%;
    }

    .strength-very-strong {
      background: #1abc9c;
      width: 100%;
    }

    .strength-label {
      font-size: 0.75rem;
      margin-top: 2px;
    }

    .strength-label.weak {
      color: #e74c3c;
    }

    .strength-label.fair {
      color: #f39c12;
    }

    .strength-label.strong {
      color: #27ae60;
    }

    .strength-label.very-strong {
      color: #1abc9c;
    }

    /* ===== QUIZ PAGE ===== */
    .quiz-page {
      min-height: 100vh;
      padding-top: 80px;
      background: var(--bg);
    }

    .quiz-header {
      padding: 2rem 2rem 0;
      max-width: 720px;
      margin: 0 auto;
    }

    .quiz-progress-bar {
      height: 6px;
      background: var(--card-border);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 1rem;
    }

    .quiz-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--forest), var(--forest-light));
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    body.dark .quiz-progress-fill {
      background: linear-gradient(90deg, var(--gold), var(--gold-light));
    }

    .quiz-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .quiz-counter {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .quiz-category-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(201, 168, 76, 0.1);
      border: 1px solid rgba(201, 168, 76, 0.3);
      color: var(--gold);
    }

    .quiz-container {
      max-width: 720px;
      margin: 0 auto;
      padding: 1.5rem 2rem 4rem;
    }

    .question-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2.5rem;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-lg);
      animation: questionIn 0.4s ease;
    }

    @keyframes questionIn {
      from {
        opacity: 0;
        transform: translateX(20px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .question-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 500;
      color: var(--text-dark);
      line-height: 1.4;
      margin-bottom: 2rem;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .option-card {
      padding: 1.25rem 1.5rem;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      background: var(--card-bg);
      cursor: pointer;
      transition: var(--transition);
      text-align: left;
      font-size: 0.95rem;
      color: var(--text-mid);
      line-height: 1.5;
      width: 100%;
    }

    .option-card:hover {
      border-color: var(--gold);
      transform: translateX(4px);
    }

    .option-card.selected-vata {
      border-color: var(--vata);
      background: rgba(123, 157, 186, 0.1);
      color: var(--text-dark);
    }

    .option-card.selected-pitta {
      border-color: var(--pitta);
      background: rgba(196, 112, 74, 0.1);
      color: var(--text-dark);
    }

    .option-card.selected-kapha {
      border-color: var(--kapha);
      background: rgba(92, 140, 106, 0.1);
      color: var(--text-dark);
    }

    .option-letter {
      display: inline-flex;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      margin-right: 12px;
      background: var(--cream-dark);
      color: var(--text-muted);
      flex-shrink: 0;
      float: left;
    }

    .option-card.selected-vata .option-letter {
      background: var(--vata);
      color: white;
    }

    .option-card.selected-pitta .option-letter {
      background: var(--pitta);
      color: white;
    }

    .option-card.selected-kapha .option-letter {
      background: var(--kapha);
      color: white;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      margin-top: 2rem;
      gap: 1rem;
    }

    .quiz-btn {
      padding: 12px 32px;
      border-radius: 32px;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      transition: var(--transition);
    }

    .quiz-btn-back {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-mid);
    }

    .quiz-btn-back:hover {
      border-color: var(--text-mid);
    }

    .quiz-btn-back:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .quiz-btn-continue {
      background: linear-gradient(135deg, var(--forest), var(--forest-mid));
      color: var(--white);
      flex: 1;
    }

    body.dark .quiz-btn-continue {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      color: var(--forest);
    }

    .quiz-btn-continue:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .quiz-btn-continue:not(:disabled):hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    /* ===== RESULTS PAGE ===== */
    .results-page {
      min-height: 100vh;
      padding-top: 80px;
      background: var(--bg);
    }

    .results-hero {
      text-align: center;
      padding: 4rem 2rem 2rem;
      background: linear-gradient(160deg, rgba(26, 61, 43, 0.04) 0%, rgba(201, 168, 76, 0.06) 100%);
    }

    body.dark .results-hero {
      background: linear-gradient(160deg, rgba(26, 61, 43, 0.2) 0%, rgba(201, 168, 76, 0.05) 100%);
    }

    .results-reveal {
      font-size: 0.9rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
      margin-bottom: 1rem;
      animation: fadeInDown 0.8s ease;
    }

    .results-prakriti-name {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--forest), var(--forest-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
      animation: fadeInUp 0.8s ease 0.1s both;
    }

    body.dark .results-prakriti-name {
      background: linear-gradient(135deg, var(--gold), var(--gold-light));
      -webkit-background-clip: text;
      background-clip: text;
    }

    .results-tagline {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      animation: fadeInUp 0.8s ease 0.2s both;
    }

    .results-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem;
    }

    .results-section {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 2rem;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
    }

    .results-section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 1.5rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid var(--card-border);
    }

    .chart-donut-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .chart-donut-wrapper canvas {
      max-width: 260px;
      max-height: 260px;
    }

    .dosha-bars {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .dosha-bar-row {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .dosha-bar-label {
      width: 60px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .dosha-bar-label.vata {
      color: var(--vata);
    }

    .dosha-bar-label.pitta {
      color: var(--pitta);
    }

    .dosha-bar-label.kapha {
      color: var(--kapha);
    }

    .dosha-bar-track {
      flex: 1;
      height: 12px;
      background: var(--cream-dark);
      border-radius: 6px;
      overflow: hidden;
    }

    body.dark .dosha-bar-track {
      background: rgba(255, 255, 255, 0.08);
    }

    .dosha-bar-fill {
      height: 100%;
      border-radius: 6px;
      transition: width 1.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .dosha-bar-fill.vata {

    const LoginPage = ({ setPage, onLogin, addToast, t }) => {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [showPw, setShowPw] = useState(false);
      const [remember, setRemember] = useState(false);
      const [errors, setErrors] = useState({});
      const [loading, setLoading] = useState(false);

      const validate = () => {
        const e = {};
        if (!email) e.email = 'Email is required';
        else if (!/\S+@\S+\.\S+/.test(email)) e.email = 'Please enter a valid email';
        if (!password) e.password = 'Password is required';
        return e;
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        const errs = validate();
        if (Object.keys(errs).length) { setErrors(errs); return; }
        setLoading(true);
        await new Promise(r => setTimeout(r, 800));
        const users = getUsers();
        const user = users.find(u => u.email.toLowerCase() === email.toLowerCase() && u.password === password);
        if (!user) {
          setErrors({ form: 'Invalid email or password. Please try again.' });
          setLoading(false); return;
        }
        const updatedUser = { ...user, lastLogin: new Date().toISOString() };
        const updated = users.map(u => u.id === user.id ? updatedUser : u);
        saveUsers(updated);
        saveCurrentUser(updatedUser);
        onLogin(updatedUser);
        addToast(`Welcome back, ${user.name}!`, 'success');
        setPage('quiz');
        setLoading(false);
      };

      const handleGoogle = () => {
        addToast('Google Sign-In is simulated in this demo.', 'success');
      };

      return (
        <div className="auth-layout page-enter" style={{ paddingTop: '64px' }}>
          <div className="auth-deco">

                  <label className="form-label">Email address</label>

        return { label: 'Very Strong', cls: 'very-strong' };

    const QuizPage = ({ currentUser, setPage, addToast, onResultSave }) => {
      const [current, setCurrent] = useState(0);
      const [answers, setAnswers] = useState(Array(30).fill(null));
      const [result, setResult] = useState(null);
      const [key, setKey] = useState(0);

      if (!currentUser) {
        return (
          <div className="quiz-page">
            <div className="protected-msg">
              <div className="protected-icon">🔒</div>
              <h2>Assessment Protected</h2>
              <p>Please create an account or log in to take the Prakriti assessment and save your results.</p>
              <div style={{ display: 'flex', gap: '1rem', justifyContent: 'center' }}>
                <button className="btn-action btn-action-primary" onClick={() => setPage('login')}>Login</button>
                <button className="btn-action btn-action-outline" onClick={() => setPage('signup')}>Sign Up Free</button>
              </div>
            </div>
          </div>
        );
      }

      if (result) {
        return <ResultsPage result={result} setPage={setPage} currentUser={currentUser} addToast={addToast} />;
      }

      const q = QUESTIONS[current];
      const selected = answers[current];
      const progress = ((current + (selected !== null ? 1 : 0)) / 30) * 100;

      const selectOption = (idx) => {
        const newAnswers = [...answers];
        newAnswers[current] = idx;
        setAnswers(newAnswers);
      };

      const goNext = () => {
        if (current === 29) {
          // Calculate scores
          let vata = 0, pitta = 0, kapha = 0;
          answers.forEach((ans, qi) => {
            if (ans === null) return;
            const dosha = QUESTIONS[qi].doshas[ans];
            if (dosha === 'vata') vata++;
            else if (dosha === 'pitta') pitta++;
            else kapha++;
          });
          const total = vata + pitta + kapha;
          const percentages = {
            vata: Math.round((vata / 30) * 100),
            pitta: Math.round((pitta / 30) * 100),
            kapha: Math.round((kapha / 30) * 100)
          };
          const prakriti = computePrakriti({ vata, pitta, kapha });
          const sorted = [['vata', vata], ['pitta', pitta], ['kapha', kapha]].sort((a, b) => b[1] - a[1]);
          const assessment = {
            id: generateId(), takenAt: new Date().toISOString(),
            scores: { vata, pitta, kapha }, percentages, prakriti,
            dominant: sorted[0][0]
          };
          // Save to user
          const users = getUsers();
          const updated = users.map(u => {
            if (u.id === currentUser.id) {
              return { ...u, assessments: [...u.assessments, assessment] };
            }
            return u;
          });
          saveUsers(updated);
          const updUser = updated.find(u => u.id === currentUser.id);
          if (updUser) saveCurrentUser(updUser);
          onResultSave && onResultSave(updUser);
          addToast('Assessment complete! Your results are ready. 🌿', 'success');
          setResult(assessment);
        } else {
          setCurrent(c => c + 1);
          setKey(k => k + 1);
        }
      };

      const goBack = () => { if (current > 0) { setCurrent(c => c - 1); setKey(k => k + 1); } };

      return (
        <div className="quiz-page">
          <div className="quiz-header">
            <div className="quiz-meta">
              <span className="quiz-counter">Question {current + 1} of 30</span>
              <span className="quiz-category-badge">{q.cat}</span>
            </div>
            <div className="quiz-progress-bar">
              <div className="quiz-progress-fill" style={{ width: `${((current + 1) / 30) * 100}%` }}></div>
            </div>
          </div>
          <div className="quiz-container">
            <div className="question-card" key={key}>
              <p className="question-text">{q.q}</p>
              <div className="options-list">
                {q.opts.map((opt, i) => {
                  const dosha = q.doshas[i];
                  const isSel = selected === i;
                  return (
                    <button
                      key={i}
                      className={`option-card${isSel ? ` selected-${dosha}` : ''}`}
                      onClick={() => selectOption(i)}
                    >
                      <span className="option-letter">{String.fromCharCode(65 + i)}</span>
                      {opt}
                    </button>
                  );
                })}
              </div>
              <div className="quiz-nav">
                <button className="quiz-btn quiz-btn-back" onClick={goBack} disabled={current === 0}>← Back</button>
                <button className="quiz-btn quiz-btn-continue" onClick={goNext} disabled={selected === null}>
                  {current === 29 ? 'View My Results ✨' : 'Continue →'}
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ═══════════════════════════════════════════
    // ADMIN DASHBOARD
    // ═══════════════════════════════════════════
    const AdminPage = ({ currentUser, setPage, addToast, setCurrentUser }) => {
      const [tab, setTab] = useState('dashboard');
      const [users, setUsers] = useState([]);
      const [search, setSearch] = useState('');
      const [roleFilter, setRoleFilter] = useState('all');
      const [prakritiFilter, setPrakritiFilter] = useState('all');
      const [viewUser, setViewUser] = useState(null);
      const [adminName, setAdminName] = useState(currentUser?.name || '');
      const [adminPw, setAdminPw] = useState('');
      const [settings, setSettingsState] = useState(getSettings());
      const chartDistRef = useRef(null);
      const chartBarRef = useRef(null);
      const distChart = useRef(null);
      const barChart = useRef(null);

      useEffect(() => {
        setUsers(getUsers());
      }, []);

      useEffect(() => {
        if (tab === 'dashboard') {
          setTimeout(() => { initCharts(); }, 100);
        }
        return () => {
          if (distChart.current) distChart.current.destroy();
          if (barChart.current) barChart.current.destroy();
        };
      }, [tab, users]);

      if (!currentUser || currentUser.role !== 'admin') {
        return (
          <div className="protected-msg">
            <div className="protected-icon">🚫</div>
            <h2>Access Denied</h2>
            <p>This page is only accessible to administrators.</p>
            <button className="btn-action btn-action-primary" onClick={() => setPage('home')}>Back to Home</button>
          </div>
        );
      }

      const allAssessments = users.flatMap(u => u.assessments.map(a => ({ ...a, userName: u.name, userEmail: u.email })));
      const totalUsers = users.filter(u => u.role === 'user').length;
      const totalAssessments = allAssessments.length;
      const oneWeekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
      const newUsersThisWeek = users.filter(u => new Date(u.createdAt) > oneWeekAgo).length;
      const prakrityCounts = allAssessments.reduce((acc, a) => { acc[a.prakriti] = (acc[a.prakriti] || 0) + 1; return acc; }, {});
      const mostCommon = Object.entries(prakrityCounts).sort((a, b) => b[1] - a[1])[0]?.[0] || '—';

      const initCharts = () => {
        if (distChart.current) distChart.current.destroy();
        if (barChart.current) barChart.current.destroy();

        if (chartDistRef.current) {
          const labels = Object.keys(prakrityCounts);
          const values = Object.values(prakrityCounts);
          distChart.current = new Chart(chartDistRef.current, {
            type: 'doughnut',
            data: { labels, datasets: [{ data: values, backgroundColor: ['rgba(123,157,186,0.8)', 'rgba(196,112,74,0.8)', 'rgba(92,140,106,0.8)', 'rgba(201,168,76,0.8)', 'rgba(150,100,180,0.8)', 'rgba(180,140,80,0.8)', 'rgba(100,160,120,0.8)'], borderWidth: 2 }] },
            options: { responsive: true, maintainAspectRatio: true, cutout: '60%', plugins: { legend: { display: true, position: 'bottom', labels: { color: 'var(--text-mid)', font: { size: 11 } } } } }
          });
        }
        if (chartBarRef.current) {
          const days = Array.from({ length: 7 }, (_, i) => {
            const d = new Date(); d.setDate(d.getDate() - 6 + i);
            return d.toLocaleDateString('en-IN', { weekday: 'short' });
          });
          const counts = days.map((_, i) => {
            const d = new Date(); d.setDate(d.getDate() - 6 + i);
            return allAssessments.filter(a => {
              const ad = new Date(a.takenAt);
              return ad.toDateString() === d.toDateString();
            }).length;
          });
          barChart.current = new Chart(chartBarRef.current, {
            type: 'bar',
            data: { labels: days, datasets: [{ label: 'Assessments', data: counts, backgroundColor: 'rgba(201,168,76,0.7)', borderColor: 'var(--gold)', borderWidth: 1.5, borderRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: true, scales: { y: { beginAtZero: true, ticks: { stepSize: 1, color: 'var(--text-muted)' }, grid: { color: 'rgba(0,0,0,0.05)' } }, x: { ticks: { color: 'var(--text-muted)' }, grid: { display: false } } }, plugins: { legend: { display: false } } }
          });
        }
      };

      const filteredUsers = users.filter(u => {
        const matchSearch = !search || u.name.toLowerCase().includes(search.toLowerCase()) || u.email.toLowerCase().includes(search.toLowerCase());
        const matchRole = roleFilter === 'all' || u.role === roleFilter;
        const userPrakriti = u.assessments.slice(-1)[0]?.prakriti;
        const matchPrakriti = prakritiFilter === 'all' || userPrakriti === prakritiFilter;
        return matchSearch && matchRole && matchPrakriti;
      });

      const toggleAdmin = (userId) => {
        const updated = users.map(u => {
          if (u.id === userId) return { ...u, role: u.role === 'admin' ? 'user' : 'admin' };
          return u;
        });
        saveUsers(updated); setUsers(updated);
        addToast('User role updated.', 'success');
      };

      const deleteUser = (userId) => {
        if (!confirm('Are you sure you want to delete this user? This cannot be undone.')) return;
        const updated = users.filter(u => u.id !== userId);
        saveUsers(updated); setUsers(updated);
        addToast('User deleted.', 'success');
      };

      const saveAdminSettings = () => {
        if (adminName.trim()) {
          const updated = users.map(u => u.id === currentUser.id ? { ...u, name: adminName } : u);
          saveUsers(updated);
          const upd = { ...currentUser, name: adminName };
          saveCurrentUser(upd); setCurrentUser(upd);
        }
        if (adminPw) {
          const updated = users.map(u => u.id === currentUser.id ? { ...u, password: adminPw } : u);
          saveUsers(updated);
        }
        saveSettings(settings);
        addToast('Settings saved!', 'success');
      };

      const exportData = () => {
        const data = { users: getUsers(), settings: getSettings(), exportedAt: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'prakritisense_data.json'; a.click();
        URL.revokeObjectURL(url);
        addToast('Data exported!', 'success');
      };

      return (
        <div className="admin-layout page-enter">
          <div className="admin-nav-inner">
            {[['dashboard', '📊 Dashboard'], ['users', '👥 Users'], ['assessments', '📋 Assessments'], ['settings', '⚙️ Settings']].map(([id, label]) => (
              <button key={id} className={`admin-tab-btn${tab === id ? ' active' : ''}`} onClick={() => setTab(id)}>{label}</button>
            ))}
          </div>

          <div className="admin-content">
            {/* DASHBOARD */}
            {tab === 'dashboard' && (
              <div>
                <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: '2rem', marginBottom: '1.5rem' }}>Dashboard Overview</h2>
                <div className="stat-cards">
                  {[
                    { label: 'Total Users', value: totalUsers, sub: 'Registered accounts' },
                    { label: 'Total Assessments', value: totalAssessments, sub: 'Completed quizzes' },
                    { label: 'Most Common', value: mostCommon || '—', sub: 'Prakriti type' },
                    { label: 'New This Week', value: newUsersThisWeek, sub: 'New signups (7 days)' },
                  ].map(({ label, value, sub }) => (
                    <div key={label} className="stat-card">
                      <div className="stat-card-label">{label}</div>
                      <div className="stat-card-value">{value}</div>
                      <div className="stat-card-sub">{sub}</div>
                    </div>
                  ))}
                </div>
                <div className="admin-charts">
                  <div className="admin-chart-card">
                    <h3>Prakriti Distribution</h3>
                    {totalAssessments === 0 ? <p style={{ color: 'var(--text-muted)', fontSize: '0.9rem' }}>No assessments yet.</p> : <canvas ref={chartDistRef}></canvas>}
                  </div>
                  <div className="admin-chart-card">
                    <h3>Assessments — Last 7 Days</h3>
                    <canvas ref={chartBarRef}></canvas>
                  </div>
                </div>
              </div>
            )}

            {/* USERS */}
            {tab === 'users' && (
              <div>
                <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: '2rem', marginBottom: '1.5rem' }}>User Management</h2>
                <div className="admin-filters">
                  <input className="admin-search" placeholder="Search by name or email..." value={search} onChange={e => setSearch(e.target.value)} />
                  <select className="admin-select" value={roleFilter} onChange={e => setRoleFilter(e.target.value)}>
                    <option value="all">All Roles</option>
                    <option value="user">Users</option>
                    <option value="admin">Admins</option>
                  </select>
                  <select className="admin-select" value={prakritiFilter} onChange={e => setPrakritiFilter(e.target.value)}>
                    <option value="all">All Prakriti Types</option>a
                    {['Vata', 'Pitta', 'Kapha', 'Vata-Pitta', 'Pitta-Kapha', 'Vata-Kapha', 'Tridoshic'].map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
                <div className="admin-section-card">
                  <div className="table-wrapper">
                    <table>
                      <thead>
                        <tr>
                          {['#', 'Name', 'Email', 'Role', 'Joined', 'Last Login', 'Prakriti', 'Assessments', 'Actions'].map(h => <th key={h}>{h}</th>)}
                        </tr>
                      </thead>
                      <tbody>
                        {filteredUsers.map((u, i) => {
                          const lastPrakriti = u.assessments.slice(-1)[0]?.prakriti;
                          return (
                            <tr key={u.id}>
                              <td>{i + 1}</td>
                              <td><strong>{u.name}</strong></td>
                              <td style={{ color: 'var(--text-muted)' }}>{u.email}</td>
                              <td><span className={`role-badge ${u.role}`}>{u.role}</span></td>
                              <td>{fmtDate(u.createdAt)}</td>
                              <td>{fmtDate(u.lastLogin)}</td>
                              <td>{lastPrakriti ? <span className="prakriti-badge">{lastPrakriti}</span> : '—'}</td>
                              <td><strong>{u.assessments.length}</strong></td>
                              <td>
                                <button className="btn-table-action btn-view" onClick={() => setViewUser(u)}>View</button>
                                {u.id !== currentUser.id && (
                                  <button className="btn-table-action btn-promote" onClick={() => toggleAdmin(u.id)}>{u.role === 'admin' ? 'Demote' : 'Promote'}</button>
                                )}
                                {u.id !== currentUser.id && (
                                  <button className="btn-table-action btn-delete" onClick={() => deleteUser(u.id)}>Delete</button>
                                )}
                              </td>
                            </tr>
                          );
                        })}
                        {filteredUsers.length === 0 && (
                          <tr><td colSpan={9} style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>No users found.</td></tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* ASSESSMENTS */}
            {tab === 'assessments' && (
              <div>
                <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: '2rem', marginBottom: '1.5rem' }}>All Assessments</h2>
                <div className="admin-section-card">
                  <div className="table-wrapper">
                    <table>
                      <thead>
                        <tr>{['User', 'Email', 'Date', 'Prakriti', 'Vata%', 'Pitta%', 'Kapha%'].map(h => <th key={h}>{h}</th>)}</tr>
                      </thead>
                      <tbody>
                        {allAssessments.length === 0 && <tr><td colSpan={7} style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>No assessments recorded yet.</td></tr>}
                        {allAssessments.map((a, i) => (
                          <tr key={i}>
                            <td><strong>{a.userName}</strong></td>
                            <td style={{ color: 'var(--text-muted)' }}>{a.userEmail}</td>
                            <td>{fmtDate(a.takenAt)}</td>
                            <td><span className="prakriti-badge">{a.prakriti}</span></td>
                            <td style={{ color: 'var(--vata)' }}>{a.percentages?.vata ?? a.scores?.vata}%</td>
                            <td style={{ color: 'var(--pitta)' }}>{a.percentages?.pitta ?? a.scores?.pitta}%</td>
                            <td style={{ color: 'var(--kapha)' }}>{a.percentages?.kapha ?? a.scores?.kapha}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* SETTINGS */}
            {tab === 'settings' && (
              <div>
                <h2 style={{ fontFamily: "'Cormorant Garamond',serif", fontSize: '2rem', marginBottom: '1.5rem' }}>Settings</h2>
                <div className="settings-grid">
                  <div className="admin-section-card">
                    <h3>Admin Profile</h3>
                    <div className="form-group">
                      <label className="form-label">Display Name</label>
                      <input className="form-input" value={adminName} onChange={e => setAdminName(e.target.value)} />
                    </div>
                    <div className="form-group">
                      <label className="form-label">New Password</label>
                      <input className="form-input" type="password" placeholder="Leave blank to keep current" value={adminPw} onChange={e => setAdminPw(e.target.value)} />
                    </div>
                  </div>
                  <div className="admin-section-card">
                    <h3>App Settings</h3>
                    <div className="settings-toggle-row">
                      <div className="settings-label">
                        <strong>Allow New Registrations</strong>
                        Permit new users to sign up
                      </div>
                      <button className={`toggle-switch${settings.allowRegistration ? ' on' : ''}`} onClick={() => setSettingsState(s => ({ ...s, allowRegistration: !s.allowRegistration }))}>
                        <div className="toggle-knob"></div>
                      </button>
                    </div>
                    <div className="settings-toggle-row">
                      <div className="settings-label">
                        <strong>Show Quiz to All</strong>
                        Allow non-logged users to see quiz
                      </div>
                      <button className={`toggle-switch${settings.showQuizToAll ? ' on' : ''}`} onClick={() => setSettingsState(s => ({ ...s, showQuizToAll: !s.showQuizToAll }))}>
                        <div className="toggle-knob"></div>
                      </button>
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: '1rem', marginTop: '1rem', flexWrap: 'wrap' }}>
                  <button className="btn-action btn-action-primary" onClick={saveAdminSettings}>💾 Save Settings</button>
                  <button className="btn-action btn-action-outline" onClick={exportData}>📤 Export All Data as JSON</button>
                </div>
              </div>
            )}
          </div>

          {/* USER DETAIL MODAL */}
          {viewUser && (
            <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setViewUser(null)}>
              <div className="modal-box">
                <div className="modal-header">
                  <h2>User Profile</h2>
                  <button className="modal-close" onClick={() => setViewUser(null)}>✕</button>
                </div>
                <div className="modal-body">
                  <div className="user-profile-header">
                    <div className="user-profile-avatar">{viewUser.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()}</div>
                    <div className="user-profile-info">
                      <h3>{viewUser.name}</h3>
                      <p>{viewUser.email} · <span className={`role-badge ${viewUser.role}`}>{viewUser.role}</span></p>
                      <p style={{ marginTop: '4px' }}>Joined {fmtDate(viewUser.createdAt)}</p>
                    </div>
                  </div>
                  <h4 style={{ marginBottom: '1rem', color: 'var(--text-dark)' }}>Assessment History ({viewUser.assessments.length})</h4>
                  {viewUser.assessments.length === 0 && <p style={{ color: 'var(--text-muted)' }}>No assessments taken yet.</p>}
                  <div className="assessment-timeline">
                    {viewUser.assessments.slice().reverse().map((a, i) => (
                      <div key={i} className="assessment-entry">
                        <div className="assessment-entry-header">
                          <span className="prakriti-badge">{a.prakriti}</span>
                          <span style={{ fontSize: '0.8rem', color: 'var(--text-muted)' }}>{fmtDate(a.takenAt)}</span>
                        </div>
                        <div className="assessment-mini-bars">
                          {[['Vata', a.percentages?.vata ?? a.scores?.vata, 'var(--vata)'], ['Pitta', a.percentages?.pitta ?? a.scores?.pitta, 'var(--pitta)'], ['Kapha', a.percentages?.kapha ?? a.scores?.kapha, 'var(--kapha)']].map(([d, v, c]) => (
                            <span key={d} className="mini-bar-item" style={{ color: c, fontWeight: 600 }}>{d}: {v}%</span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    // ═══════════════════════════════════════════
    // MAIN APP
    // ═══════════════════════════════════════════
    const App = () => {
      const [currentPage, setCurrentPage] = useState('home');
      const [currentUser, setCurrentUser] = useState(null);
      const [darkMode, setDarkMode] = useState(false);
      const [lang, setLang] = useState('en');
      const [toasts, setToasts] = useState([]);

      useEffect(() => {
        seedAdmin();
        const user = getCurrentUser();
        if (user) setCurrentUser(user);
        const dm = localStorage.getItem('ps_dark') === 'true';
        if (dm) { setDarkMode(true); document.body.classList.add('dark'); }
        const lng = localStorage.getItem('ps_lang') || 'en';
        setLang(lng);
      }, []);

      const toggleDark = () => {
        const nd = !darkMode;
        setDarkMode(nd);
        document.body.classList.toggle('dark', nd);
        localStorage.setItem('ps_dark', nd);
      };

      const toggleLang = () => {
        const nl = lang === 'en' ? 'ml' : 'en';
        setLang(nl);
        localStorage.setItem('ps_lang', nl);
      };

      const addToast = (msg, type = 'success') => {
        const id = generateId();
        setToasts(t => [...t, { id, msg, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3000);
      };

      const handleLogout = () => {
        clearCurrentUser();
        setCurrentUser(null);
        setCurrentPage('home');
        addToast('Logged out successfully.', 'success');
      };

      const handleLogin = (user) => setCurrentUser(user);

      const handleResultSave = (updUser) => {
        if (updUser) { setCurrentUser(updUser); saveCurrentUser(updUser); }
      };

      const t = TRANSLATIONS[lang];

      const setPage = (page) => {
        window.scrollTo(0, 0);
        setCurrentPage(page);
      };

      const navbarProps = { currentPage, setPage, currentUser, onLogout: handleLogout, darkMode, toggleDark, lang, toggleLang, t };

      const renderPage = () => {
        switch (currentPage) {
          case 'home': return <HomePage setPage={setPage} t={t} />;
          case 'login': return <LoginPage setPage={setPage} onLogin={handleLogin} addToast={addToast} t={t} />;
          case 'signup': return <SignupPage setPage={setPage} onLogin={handleLogin} addToast={addToast} t={t} />;
          case 'quiz': return <QuizPage currentUser={currentUser} setPage={setPage} addToast={addToast} onResultSave={handleResultSave} />;
          case 'admin': return <AdminPage currentUser={currentUser} setPage={setPage} addToast={addToast} setCurrentUser={setCurrentUser} />;
          default: return <HomePage setPage={setPage} t={t} />;
        }
      };

      const showNavbar = !['login', 'signup'].includes(currentPage);

      return (
        <div>
          {showNavbar && <Navbar {...navbarProps} />}
          <main style={{ paddingTop: showNavbar ? '64px' : '0' }}>
            {renderPage()}
          </main>
          <ToastContainer toasts={toasts} />
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
